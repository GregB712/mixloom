# One-command local stack: FastAPI backend + Vite frontend. The database is
# hosted (Neon): the backend reads DATABASE_URL from .env.
#   docker compose up --build
# Then open http://localhost:5173 (backend on http://localhost:8888).
#
# Spotify credentials are read from .env (SPOTIPY_CLIENT_ID/SECRET/REDIRECT_URI,
# FREQBLOG_API_KEY, CONTACT_EMAIL). Keep SPOTIPY_REDIRECT_URI pointing at
# http://127.0.0.1:8888/callback so the published backend port handles the OAuth
# callback.
services:
  backend:
    build:
      context: .
      dockerfile: web/backend/Dockerfile
    container_name: mixloom_backend
    restart: unless-stopped
    env_file: .env
    environment:
      FRONTEND_URL: http://localhost:5173
    ports:
      - "127.0.0.1:8888:8888"

  frontend:
    build:
      context: web/frontend
      dockerfile: Dockerfile
    container_name: mixloom_frontend
    restart: unless-stopped
    environment:
      VITE_API_PROXY: http://backend:8888
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - backend

