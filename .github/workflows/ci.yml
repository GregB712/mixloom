name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  frontend:
    name: Frontend (typecheck · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm test

  backend:
    name: Backend (lint · test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: spotify
          POSTGRES_PASSWORD: spotify
          POSTGRES_DB: spotify_meta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U spotify -d spotify_meta"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://spotify:spotify@localhost:5432/spotify_meta
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt ruff
      - name: Lint
        run: ruff check scripts web/backend
      - name: Apply migrations
        run: python scripts/db_migrate.py
      - name: Tests
        run: pytest
